# OCI VM OI/ML shadow sidecar.
#
# Run this beside the live stack from a separate checkout/image. It publishes no
# ports, starts no nginx, and runs the standalone shadow runner instead of
# app.main. It records dry-run shadow intents only.

name: phoenix-oi-ml-shadow

services:
  oi-ml-migrator:
    image: postgres:16-alpine
    container_name: phoenix-oi-ml-shadow-migrator
    restart: "no"
    env_file:
      - /opt/phoenix/phoenix-deploy.env
    environment:
      PGHOST: "phoenix-oci-postgres"
      PGPORT: "5432"
      PGDATABASE: "${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB in phoenix-deploy.env}"
      PGUSER: "${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER in phoenix-deploy.env}"
      PGSSLMODE: "prefer"
      PGCONNECT_TIMEOUT: "10"
      PHX_MIGRATION_APP_NAME: "phoenix-oi-ml-shadow"
    volumes:
      - /opt/phoenix/oi-ml-shadow-src/migrations:/migrations:ro
      - /run/secrets/control_plane_pg_password:/run/secrets/control_plane_pg_password:ro
    networks:
      - phoenix_live
    command:
      - sh
      - -ec
      - |
          export PGPASSWORD="$$(cat /run/secrets/control_plane_pg_password)"
          psql -v ON_ERROR_STOP=1 -f /migrations/021_option_chain_1m.sql
          psql -v ON_ERROR_STOP=1 -f /migrations/022_oi_ml_shadow_order_intents.sql
          psql -v ON_ERROR_STOP=1 -f /migrations/023_option_chain_validation_reports.sql
          psql -v ON_ERROR_STOP=1 -f /migrations/024_option_chain_greeks.sql
          psql -v ON_ERROR_STOP=1 -f /migrations/025_oi_ml_shadow_virtual_lifecycle.sql

  oi-ml-shadow:
    image: phoenix-oi-ml-shadow:${IMAGE_TAG:-local}
    container_name: phoenix-oi-ml-shadow
    init: true
    restart: unless-stopped
    depends_on:
      oi-ml-migrator:
        condition: service_completed_successfully
    env_file:
      - /opt/phoenix/phoenix-deploy.env
    environment:
      APP_ENV: "shadow"
      TRADE_MODE: "PAPER"
      REQUIRE_LIVE_TRADE_MODE: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "Asia/Kolkata"
      DEFAULT_TIME_ZONE: "Asia/Kolkata"

      CONTROL_PLANE_BACKEND: "postgres"
      SWEEP_STATE_BACKEND: "postgres"
      BROKER_SECRET_BACKEND: "postgres"
      CONTROL_PLANE_PG_HOST: "phoenix-oci-postgres"
      CONTROL_PLANE_PG_PORT: "5432"
      CONTROL_PLANE_PG_DB: "${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB in phoenix-deploy.env}"
      CONTROL_PLANE_PG_USER: "${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER in phoenix-deploy.env}"
      CONTROL_PLANE_PG_SSLMODE: "prefer"
      CONTROL_PLANE_DB_DSN: "postgresql://${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER in phoenix-deploy.env}@phoenix-oci-postgres:5432/${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB in phoenix-deploy.env}?sslmode=prefer"
      LIVE_PG_SSL_SKIP_CHECK: "true"
      REMOTE_DEPLOYMENT: "false"
      POSTGRES_CONNECT_TIMEOUT_SECONDS: "10"
      POSTGRES_SESSION_TIMEZONE: "Asia/Kolkata"
      ANGEL_HTTP_TIMEOUT_SECONDS: "${ANGEL_HTTP_TIMEOUT_SECONDS:-20}"
      ANGEL_LOGIN_HTTP_TIMEOUT_SECONDS: "${ANGEL_LOGIN_HTTP_TIMEOUT_SECONDS:-20}"

      DISABLE_STREAM_WORKER: "true"
      ENABLE_MULTI_HUB: "false"
      USE_HUB_ROUTER: "false"
      LEADER_LEASE_ENABLED: "false"
      OI_ML_SHADOW_ENABLED: "true"
      OI_ML_SHADOW_UNDERLYING: "${OI_ML_SHADOW_UNDERLYING:-NIFTY}"
      OI_ML_SHADOW_PROVIDER: "${OI_ML_SHADOW_PROVIDER:-angel}"
      OI_ML_SHADOW_CADENCE_SECONDS: "${OI_ML_SHADOW_CADENCE_SECONDS:-60}"
      OI_ML_SHADOW_MAX_ITERATIONS: "${OI_ML_SHADOW_MAX_ITERATIONS:-}"
      OI_ML_SHADOW_MARKET_WINDOW_ONLY: "${OI_ML_SHADOW_MARKET_WINDOW_ONLY:-true}"
      OI_ML_SHADOW_START_TIME: "${OI_ML_SHADOW_START_TIME:-09:45}"
      OI_ML_SHADOW_END_TIME: "${OI_ML_SHADOW_END_TIME:-14:30}"
      OI_ML_SHADOW_SNAPSHOT_START_TIME: "${OI_ML_SHADOW_SNAPSHOT_START_TIME:-09:15}"
      OI_ML_SHADOW_SNAPSHOT_END_TIME: "${OI_ML_SHADOW_SNAPSHOT_END_TIME:-15:30}"
      OI_ML_SHADOW_CAPTURE_SNAPSHOT: "${OI_ML_SHADOW_CAPTURE_SNAPSHOT:-true}"
      OI_ML_SHADOW_MAX_STALE_SECONDS: "${OI_ML_SHADOW_MAX_STALE_SECONDS:-180}"
      OI_ML_SHADOW_VALIDATION_REQUIRED: "${OI_ML_SHADOW_VALIDATION_REQUIRED:-true}"
      OI_ML_SHADOW_VALIDATION_GATE_ENABLED: "${OI_ML_SHADOW_VALIDATION_GATE_ENABLED:-true}"
      OI_ML_SHADOW_VALIDATION_MAX_AGE_SECONDS: "${OI_ML_SHADOW_VALIDATION_MAX_AGE_SECONDS:-180}"
      # Default scorer is fail-closed until trained artifacts are promoted.
      OI_ML_SHADOW_SCORER: "${OI_ML_SHADOW_SCORER:-missing}"
      OI_ML_SHADOW_ALLOW_CONSTANT_SCORER: "${OI_ML_SHADOW_ALLOW_CONSTANT_SCORER:-false}"
      OI_ML_SHADOW_CONSTANT_PROBABILITY: "${OI_ML_SHADOW_CONSTANT_PROBABILITY:-0}"
      OI_ML_SHADOW_CONSTANT_MAE_PREMIUM: "${OI_ML_SHADOW_CONSTANT_MAE_PREMIUM:-0}"
      OI_ML_SHADOW_SPREAD_WIDTH_POINTS: "${OI_ML_SHADOW_SPREAD_WIDTH_POINTS:-200}"
      OI_ML_SHADOW_MAX_SPREAD_LOSS_RUPEES: "${OI_ML_SHADOW_MAX_SPREAD_LOSS_RUPEES:-5000}"
      OI_ML_SHADOW_MAX_OPEN_SPREADS: "${OI_ML_SHADOW_MAX_OPEN_SPREADS:-1}"
      OI_ML_SHADOW_LIGHTGBM_CLASSIFIER_PATH: "${OI_ML_SHADOW_LIGHTGBM_CLASSIFIER_PATH:-/app/models/oi_ml_ce_classifier.txt}"
      OI_ML_SHADOW_LIGHTGBM_FEATURE_NAMES_PATH: "${OI_ML_SHADOW_LIGHTGBM_FEATURE_NAMES_PATH:-/app/models/oi_ml_feature_names.json}"
      OI_ML_SHADOW_LIGHTGBM_MAE_MODEL_PATH: "${OI_ML_SHADOW_LIGHTGBM_MAE_MODEL_PATH:-}"
      OI_ML_SHADOW_LIGHTGBM_DEFAULT_MAE_PREMIUM: "${OI_ML_SHADOW_LIGHTGBM_DEFAULT_MAE_PREMIUM:-0}"
      OI_ML_SHADOW_MODEL_VALIDATION_REPORT_PATH: "${OI_ML_SHADOW_MODEL_VALIDATION_REPORT_PATH:-/app/models/oi_ml_promotion_report.json}"
      OI_ML_SHADOW_REQUIRE_MODEL_VALIDATION_REPORT: "${OI_ML_SHADOW_REQUIRE_MODEL_VALIDATION_REPORT:-true}"
      OI_ML_SHADOW_VIRTUAL_FLAT_TIME: "${OI_ML_SHADOW_VIRTUAL_FLAT_TIME:-15:20}"
      OI_ML_SHADOW_VIRTUAL_LIFECYCLE_END_TIME: "${OI_ML_SHADOW_VIRTUAL_LIFECYCLE_END_TIME:-15:45}"
      OI_ML_SHADOW_ALLOW_NAKED: "false"
      OI_SNAPSHOTTER_ENABLED: "true"
      OI_SNAPSHOTTER_REUSE_BROKER_SESSION: "${OI_SNAPSHOTTER_REUSE_BROKER_SESSION:-true}"
      OI_SNAPSHOTTER_SESSION_MAX_AGE_MINUTES: "${OI_SNAPSHOTTER_SESSION_MAX_AGE_MINUTES:-600}"
      OI_ML_ENABLE_NSE_VALIDATION: "${OI_ML_ENABLE_NSE_VALIDATION:-true}"
      OI_ML_NSE_VALIDATION_STORE_QUOTES: "${OI_ML_NSE_VALIDATION_STORE_QUOTES:-true}"
      OI_ML_NSE_VALIDATION_LOG_ALL: "${OI_ML_NSE_VALIDATION_LOG_ALL:-true}"
      OI_ML_NSE_VALIDATION_FAIL_ON_ERROR: "${OI_ML_NSE_VALIDATION_FAIL_ON_ERROR:-false}"
      OI_ML_NSE_VALIDATION_TIMEOUT_SECONDS: "${OI_ML_NSE_VALIDATION_TIMEOUT_SECONDS:-10}"
      OI_ML_NSE_VALIDATION_MAX_ATTEMPTS: "${OI_ML_NSE_VALIDATION_MAX_ATTEMPTS:-3}"
      OI_ML_NSE_VALIDATION_RETRY_BACKOFF_SECONDS: "${OI_ML_NSE_VALIDATION_RETRY_BACKOFF_SECONDS:-0.5}"
      OI_ML_NSE_VALIDATION_RETRY_JITTER_SECONDS: "${OI_ML_NSE_VALIDATION_RETRY_JITTER_SECONDS:-0.25}"
      OI_ML_NSE_VALIDATION_ERROR_RATE_WINDOW: "${OI_ML_NSE_VALIDATION_ERROR_RATE_WINDOW:-20}"
      OI_ML_NSE_VALIDATION_ERROR_RATE_WARN_THRESHOLD: "${OI_ML_NSE_VALIDATION_ERROR_RATE_WARN_THRESHOLD:-0.25}"
    volumes:
      - /run/secrets/control_plane_pg_password:/run/secrets/control_plane_pg_password:ro
      - /opt/phoenix/logs/oi-ml-shadow:/app/logs
      - /opt/phoenix/certs:/app/certs:ro
      - /opt/phoenix/oi-ml-models:/app/models:ro
    networks:
      - phoenix_live
    command:
      - python
      - -m
      - app.strategies.oi_ml.shadow_runner
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.strategies.oi_ml.shadow_liveness",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

networks:
  phoenix_live:
    external: true
    name: phoenix-oci-live_default
