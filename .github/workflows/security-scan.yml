name: security-scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  supply-chain-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for gitleaks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit cyclonedx-bom bandit

      - name: Run gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Python dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Python SAST (bandit)
        run: bandit -r app/ -ll --format json -o bandit-report.json || true
        # bandit exits non-zero on findings; capture and upload, fail on HIGH only
      - name: Fail on bandit HIGH findings
        run: |
          python3 - << 'EOF'
          import json, sys
          with open("bandit-report.json") as f:
              report = json.load(f)
          high = [r for r in report.get("results", []) if r.get("issue_severity") == "HIGH"]
          if high:
              for r in high:
                  print(f"HIGH: {r['filename']}:{r['line_number']} - {r['issue_text']}")
              sys.exit(1)
          print(f"bandit: 0 HIGH findings ({len(report.get('results',[]))} total)")
          EOF

      - name: Frontend dependency audit (npm audit)
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          # Audit production (runtime-shipped) deps only — Create React
          # App's dev-dep tree carries a long tail of high-severity
          # advisories in build tooling (postcss, serialize-javascript,
          # webpack-dev-server, etc.) that cannot be remediated without
          # migrating off ``react-scripts``. Those are tracked
          # separately and are not a runtime user-facing risk because
          # they never ship to the browser. Production deps must remain
          # clean at the ``high`` threshold.
          npm audit --omit=dev --audit-level=high

      - name: Frontend dependency audit — dev (informational, non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: |
          # Surface dev-dep advisories in the workflow log so they are
          # visible but do not fail the build. Remediation requires the
          # CRA → Vite/Next migration.
          npm audit --audit-level=high || true

      - name: Generate SBOM
        run: python scripts/generate_sbom.py

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-sbom
          path: |
            sbom.json
            sbom.cdx.json
          if-no-files-found: warn

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  container-scan:
    runs-on: ubuntu-latest
    # Run after images are built in ci.yml on push to main — also runs on PR for base images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: docker build -t phoenix-backend-scan:pr .

      - name: Build nginx image for scanning
        run: docker build -t phoenix-nginx-scan:pr -f nginx/Dockerfile .

      - name: Scan backend image with trivy table
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phoenix-backend-scan:pr
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan nginx image with trivy table
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phoenix-nginx-scan:pr
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate backend trivy SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phoenix-backend-scan:pr
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Generate nginx trivy SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phoenix-nginx-scan:pr
          format: sarif
          output: trivy-nginx.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true

      - name: Upload trivy SARIF results
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload trivy nginx SARIF
        if: always() && hashFiles('trivy-nginx.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-nginx.sarif
          category: trivy-nginx

      - name: Enforce backend trivy findings
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phoenix-backend-scan:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Enforce nginx trivy findings
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: phoenix-nginx-scan:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
