name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DASHBOARD_AUTH_DISABLED: "1"
      # CI-only test secret — intentionally low entropy, never used in LIVE.
      # The LIVE AUTH_TOKEN_SECRET is stored in OCI Vault and is a separate value.
      AUTH_TOKEN_SECRET: ci-test-secret-do-not-use
      DEMO_AUTH_TOKEN_SECRET: ci-test-secret-do-not-use   # backward-compat alias
      CONTROL_PLANE_DSN: postgresql://phoenix:phoenix@localhost:5432/phoenix_test
      # Prevent RuntimeError during TestClient startup when PG credentials are absent.
      # Defaults to True which forces hard failure; tests use DummyAppRuntime anyway.
      ORDER_LIFECYCLE_PERSIST_MARKERS_REQUIRED: "false"
      # Instrument universe degraded check: in CI there are no live instruments,
      # set to 0 so readyz does not fail with instrument_universe_degraded.
      MIN_TRADEABLE_INSTRUMENTS: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis

      - name: Run migrations
        run: |
          for f in migrations/*.sql; do
            psql "$CONTROL_PLANE_DSN" -f "$f" || true
          done
        env:
          PGPASSWORD: phoenix

      - name: Run unit + integration tests
        run: |
          pytest tests/ \
            --ignore=tests/frontend_e2e_backend.py \
            --ignore=tests/config/test_live_startup_validators.py \
            --ignore=tests/config/test_profile_linter.py \
            --ignore=tests/core/test_startup_config_validator.py \
            --ignore=tests/dashboard/test_tenant_routes.py \
            --ignore=tests/test_position_ownership_pending_persistence.py \
            --ignore=tests/test_section_11_7_recovery_scenarios.py \
            -x \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check app/ tests/ --output-format=github

  docs-validation:
    runs-on: ubuntu-latest
    # Advisory at first: the repository now records the checks in CI, but this
    # job is not part of the release gate until the historical docs/link corpus
    # has been cleaned enough to make failures actionable.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19

      - name: Run lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md ABOUTME.md ARCHITECTURE.md 'docs/**/*.md' 'scripts/replay/REPLAY.md'
          fail: true

  release-gate:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify test + lint gates passed
        run: echo "All gates passed — safe to release."

  deploy-oci:
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Manual-dispatch only. Production deploys are performed via SSH/bastion
    # by the operator after a controlled merge; this CI job is retained as a
    # documented deployment recipe and can be re-enabled by setting the
    # OCIR_AUTH_TOKEN, SSH_KNOWN_HOSTS, and OCI_DEPLOY_SSH_KEY repository
    # secrets and triggering "Run workflow" from the Actions tab. Auto-deploy
    # on push was disabled 2026-05-08 (post-PR #202) to stop CI from going
    # red on every main merge while the OCIR_AUTH_TOKEN secret is empty.
    if: github.event_name == 'workflow_dispatch'
    environment: oci-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to OCI Container Registry
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | \
            docker login "${{ vars.OCIR_REGION }}.ocir.io" \
              -u "${{ vars.OCIR_NAMESPACE }}/${{ vars.OCIR_USERNAME }}" \
              --password-stdin

      - name: Build and push backend image
        run: |
          IMAGE="${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/phoenix-prod/backend"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          # 'latest' is not pushed — deployments must use explicit SHA tags

      - name: Build and push nginx image
        run: |
          IMAGE="${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/phoenix-prod/nginx"
          docker build -t "$IMAGE:${{ github.sha }}" -f nginx/Dockerfile .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Set up SSH known hosts
        run: |
          mkdir -p ~/.ssh
          # Write pinned host keys stored as a GitHub Actions secret.
          # Generate with: ssh-keyscan <bastion_host> <instance_ip> | base64
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Write deploy key
        run: |
          echo "${{ secrets.OCI_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to OCI Compute Instance via bastion
        env:
          IMAGE_TAG: ${{ github.sha }}
          BASTION_USER: ${{ vars.OCI_BASTION_USER }}
          BASTION_HOST: ${{ vars.OCI_BASTION_HOST }}
          INSTANCE_USER: ${{ vars.OCI_INSTANCE_USER }}
          INSTANCE_IP: ${{ vars.OCI_INSTANCE_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o ProxyCommand="ssh -i ~/.ssh/deploy_key -W %h:%p ${BASTION_USER}@${BASTION_HOST}" \
              "${INSTANCE_USER}@${INSTANCE_IP}" \
            "cd /opt/phoenix/app && \
             IMAGE_TAG=${IMAGE_TAG} docker compose \
               -f docker-compose.oci-live.yml \
               -f /opt/phoenix/phoenix-override.yml \
               --env-file /opt/phoenix/phoenix-deploy.env \
               pull backend nginx && \
             IMAGE_TAG=${IMAGE_TAG} docker compose \
               -f docker-compose.oci-live.yml \
               -f /opt/phoenix/phoenix-override.yml \
               --env-file /opt/phoenix/phoenix-deploy.env \
               up -d --no-deps --no-build backend nginx"

      - name: Verify deployment health
        env:
          BASTION_USER: ${{ vars.OCI_BASTION_USER }}
          BASTION_HOST: ${{ vars.OCI_BASTION_HOST }}
          INSTANCE_USER: ${{ vars.OCI_INSTANCE_USER }}
          INSTANCE_IP: ${{ vars.OCI_INSTANCE_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o ProxyCommand="ssh -i ~/.ssh/deploy_key -W %h:%p ${BASTION_USER}@${BASTION_HOST}" \
              "${INSTANCE_USER}@${INSTANCE_IP}" \
            "timeout 60 bash -c 'until curl -sf http://localhost:8080/readyz; do sleep 5; done'"
