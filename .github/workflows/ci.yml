name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phoenix_test
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DASHBOARD_AUTH_DISABLED: "1"
      DEMO_AUTH_TOKEN_SECRET: ci-test-secret-do-not-use
      CONTROL_PLANE_DSN: postgresql://phoenix:phoenix@localhost:5432/phoenix_test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov hypothesis

      - name: Run migrations
        run: |
          for f in migrations/*.sql; do
            psql "$CONTROL_PLANE_DSN" -f "$f" || true
          done
        env:
          PGPASSWORD: phoenix

      - name: Run unit + integration tests
        run: |
          pytest tests/ \
            --ignore=tests/frontend_e2e_backend.py \
            -x \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check app/ tests/ --output-format=github

  release-gate:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify test + lint gates passed
        run: echo "All gates passed — safe to release."

  deploy-oci:
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Only deploy on push to main/master — not on PRs or manual dispatch.
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: oci-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to OCI Container Registry
        run: |
          echo "${{ secrets.OCIR_AUTH_TOKEN }}" | \
            docker login "${{ vars.OCIR_REGION }}.ocir.io" \
              -u "${{ vars.OCIR_NAMESPACE }}/${{ vars.OCIR_USERNAME }}" \
              --password-stdin

      - name: Build and push backend image
        run: |
          IMAGE="${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/phoenix-prod/backend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Build and push frontend image
        run: |
          IMAGE="${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/phoenix-prod/frontend"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Build and push nginx image
        run: |
          IMAGE="${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/phoenix-prod/nginx"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ./nginx
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to OCI Compute Instance via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -W %h:%p ${{ vars.OCI_BASTION_USER }}@${{ vars.OCI_BASTION_HOST }}" \
              "${{ vars.OCI_INSTANCE_USER }}@${{ vars.OCI_INSTANCE_IP }}" \
            "cd /opt/phoenix/app && \
             docker compose -f docker-compose.oci-live.yml pull backend nginx frontend && \
             docker compose -f docker-compose.oci-live.yml up -d --no-deps --no-build backend nginx"

      - name: Verify deployment health
        run: |
          # Poll /readyz via SSH tunnel — not exposed publicly
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -W %h:%p ${{ vars.OCI_BASTION_USER }}@${{ vars.OCI_BASTION_HOST }}" \
              "${{ vars.OCI_INSTANCE_USER }}@${{ vars.OCI_INSTANCE_IP }}" \
            "timeout 60 bash -c 'until curl -sf http://localhost:8080/readyz; do sleep 5; done'"
