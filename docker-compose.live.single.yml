# NON-CURRENT FOR PRODUCTION.
# The current production runtime is the OCI VM documented in
# docs/OCI_VM_RUNTIME.md. This Docker/Desktop manifest is retained for local
# engineering/reference only and must not be used as current live-operations
# guidance.
# Secrets must be injected at runtime. Do not store real secrets in repo files.

name: phoenix-live

x-db-env: &db-env
  CONTROL_PLANE_PG_HOST: "${CONTROL_PLANE_PG_HOST:-host.docker.internal}"
  CONTROL_PLANE_PG_PORT: "${CONTROL_PLANE_PG_PORT:-5432}"
  CONTROL_PLANE_PG_DB: "${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB in the current PowerShell session}"
  CONTROL_PLANE_PG_USER: "${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER in the current PowerShell session}"
  # CONTROL_PLANE_PG_PASSWORD is intentionally absent here.
  # It is injected via Docker secret /run/secrets/control_plane_pg_password
  # by docker-entrypoint.sh, preventing exposure in `docker inspect` output.
  # §105: Default to require so any deployment that omits this var uses encrypted transport.
  # Exception: set LIVE_PG_SSL_SKIP_CHECK=true ONLY for local Docker Desktop where
  # Postgres is on host.docker.internal without SSL. Never for Cloud Run or remote Postgres.
  CONTROL_PLANE_PG_SSLMODE: "${CONTROL_PLANE_PG_SSLMODE:-require}"
  POSTGRES_FORCE_IPV4: "true"
  POSTGRES_CONNECT_TIMEOUT_SECONDS: "5"
  POSTGRES_SESSION_TIMEZONE: "Asia/Kolkata"

x-live-backend-env: &live-backend-env
  <<: *db-env
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_TICKS: "0"
  UNIVERSE_LOG_FULL_LIST: "0"
  CLIENT_LOCAL_IP: "${CLIENT_LOCAL_IP:?Set CLIENT_LOCAL_IP at deploy time}"
  CLIENT_PUBLIC_IP: "${CLIENT_PUBLIC_IP:?Set CLIENT_PUBLIC_IP at deploy time}"
  MAC_ADDRESS: "${MAC_ADDRESS:?Set MAC_ADDRESS at deploy time}"
  TZ: "Asia/Kolkata"
  DEFAULT_TIME_ZONE: "Asia/Kolkata"
  LOG_FILE_PER_PROCESS: "true"
  RUNNER_MODE: "uvicorn"
  HOST: "0.0.0.0"
  PORT: "8080"
  BACKEND_URL: "http://127.0.0.1:8080"
  CORS_ORIGINS: "http://localhost,http://127.0.0.1"

  CONTROL_PLANE_BACKEND: "postgres"
  SWEEP_STATE_BACKEND: "postgres"
  BROKER_SECRET_BACKEND: "postgres"
  # NOTE: Google Firestore is NOT used by this stack. All backends (control plane,
  # sweep state, leader lease, broker secrets) are Postgres. GOOGLE_APPLICATION_CREDENTIALS
  # is not required. If any backend is changed to "firestore", ADC credentials must be
  # mounted and GOOGLE_APPLICATION_CREDENTIALS set before deployment.
  # GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/gcp-sa.json"  # only if firestore backends

  APP_RUNTIME_STARTUP_VALIDATE: "true"
  SCHEMA_CHECK_MODE: "strict"
  # BROKER_SCHEMA_CHECK_MODE controls runtime rejection of unexpected broker API response
  # shapes. Default in code is "off" for stability; set to "strict" for LIVE deployments
  # so malformed AngelOne responses are rejected at the integration boundary.
  BROKER_SCHEMA_CHECK_MODE: "strict"
  # Local Postgres does not have SSL configured. LIVE_PG_SSL_SKIP_CHECK bypasses
  # LIVE_PG_SSL_SKIP_CHECK=true bypasses the SSL enforcement check for local Docker
  # deployments where Postgres does not have SSL configured.  The default is now false
  # (enforces SSL).  Set LIVE_PG_SSL_SKIP_CHECK=true in your PowerShell session ONLY
  # when running against a host-local Postgres without SSL — never for remote/cloud deployments.
  LIVE_PG_SSL_SKIP_CHECK: "${LIVE_PG_SSL_SKIP_CHECK:-false}"
  RUNTIME_CONFIG_AUTO_ENABLE: "false"
  RUNTIME_CONFIG_ENABLED: "false"

  # ADMIN_API_KEY and DEMO_AUTH_TOKEN_SECRET are injected via Docker secrets
  # (mounted at /run/secrets/admin_api_key and /run/secrets/demo_auth_token_secret)
  # by docker-entrypoint.sh. They do NOT appear in `docker inspect` output.
  ENABLE_DEMO_AUTH: "false"
  DASHBOARD_AUTH_DISABLED: "false"
  # Docker Desktop LIVE policy: control tower routes are intentionally enabled here
  # so operators can use the strategy matrix UI from the local dashboard.
  # OCI / cloud deployments set DISABLE_CONTROL_TOWER_ROUTES=true (see docker-compose.oci-live.yml).
  # NETWORK ISOLATION REQUIRED: port 80 must be bound to 127.0.0.1 (localhost only) or a
  # trusted LAN segment. Never expose this port to the public internet without disabling this.
  DISABLE_CONTROL_TOWER_ROUTES: "false"

  ENABLE_MULTI_HUB: "true"
  USE_HUB_ROUTER: "true"
  DISABLE_STREAM_WORKER: "false"
  LEADER_LEASE_ENABLED: "true"
  LEADER_LEASE_BACKEND: "postgres"
  LEADER_LEASE_ID: "${LEADER_LEASE_ID:-phoenix-live-single-stack}"
  USE_HUB_ROUTER_FOR_NIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_BANKNIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_FINNIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_SENSEX_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_MIDCPNIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_NG_OPTIONS: "true"
  AUTO_STRATEGY_SELECT_ENABLED: "true"
  # Must be 3 (or higher) to fit the NIFTY direction-aware regime mapping
  # in app/config/strategy_env.yaml (TRENDING_UP / TRENDING_DOWN list 3
  # strategies: direction-matched, opposite-direction-for-management,
  # spread). Lower caps truncate the spread out of the selection and
  # break SL/TP/EOD management of any spread carried into TRENDING_UP/DOWN.
  # See issue #212 / PR #265 + Codex round-4 P1. Matches the safe default
  # raised in app/config/settings.py.
  AUTO_STRATEGY_MAX_ACTIVE_PER_UNDERLYING: "${AUTO_STRATEGY_MAX_ACTIVE_PER_UNDERLYING:-3}"
  AUTO_STRATEGY_MIN_HOLD_SECONDS: "${AUTO_STRATEGY_MIN_HOLD_SECONDS:-180}"

  TRADE_MODE: "LIVE"
  # Guard: startup validator rejects any deployment where TRADE_MODE != LIVE when this is set.
  REQUIRE_LIVE_TRADE_MODE: "true"
  # Canonical risk state file path. Mounts to /app/state so it is distinct from
  # the log volume and survives log rotation. Override via PHOENIX_STATE_HOST_PATH.
  RISK_STATE_PATH: "/app/state/risk_positions.json"
  DISABLE_TRADING_WINDOW_FILTER: "false"

  ENABLE_CAPITAL_CHECKS: "true"
  ALLOW_LIVE_CAPITAL_CHECKS_DISABLED: "false"
  CAPITAL_LIMITS_JSON: '${CAPITAL_LIMITS_JSON:?Set CAPITAL_LIMITS_JSON in the current PowerShell session or use start-docker-secretstore.ps1 to derive an account-specific default}'
  CAPITAL_FAIL_CLOSED_ON_MISSING_STATE: "true"
  CAPITAL_FAIL_CLOSED_ON_MISSING_NOTIONAL_PRICE: "true"
  CAPITAL_MARGIN_SHORT_OPTION_PER_LOT: "200000"
  CAPITAL_MARGIN_FUTURES_PER_LOT: "200000"
  CAPITAL_MARGIN_FUTURES_RATE: "0.12"
  CAPITAL_MARGIN_CHECK_MODE: "enforce"

  ENABLE_RISK_CHECKS: "true"
  RISK_ENABLE_DAILY_LOSS: "true"
  # Issue #221: ``RISK_MAX_DAILY_LOSS`` must be set explicitly per deployment
  # — no fallback. A ₹2000 placeholder default tripped the kill switch on a
  # ~1.6-point adverse move on a single NG_FUT lot on 2026-05-08. Operators
  # must size this per capital tier (see docs/runbooks/oci_live_deployment.md).
  # LIVE startup additionally fails closed if the value is below
  # RISK_MAX_DAILY_LOSS_LIVE_FLOOR (default ₹5,000).
  RISK_MAX_DAILY_LOSS: "${RISK_MAX_DAILY_LOSS:?Set RISK_MAX_DAILY_LOSS (e.g. 10000 for a small account; see docs/runbooks/oci_live_deployment.md)}"
  # Issue #221 / PR #243 round-1 review P2: forward the floor-override
  # env var into the container so operators can lower the LIVE start-up
  # floor (default ₹5,000) for very small accounts — or set it to 0 to
  # disable the gate entirely — without re-rolling the image. Default
  # empty string ⇒ validator falls back to the built-in ₹5,000 floor.
  RISK_MAX_DAILY_LOSS_LIVE_FLOOR: "${RISK_MAX_DAILY_LOSS_LIVE_FLOOR:-}"
  RISK_FAIL_OPEN_ON_MISSING_PNL: "false"

  ENABLE_PROFIT_CHECKS: "true"
  PROFIT_ENABLE_DAILY_TARGET: "true"
  PROFIT_DAILY_TARGET: "${PROFIT_DAILY_TARGET:-10000}"
  PROFIT_DAILY_TARGET_PAPER: "${PROFIT_DAILY_TARGET_PAPER:-10000}"
  PROFIT_BLOCK_NEW_ORDERS_ON_TARGET: "true"

  ORDER_ROUTER_ENFORCE_IDEMPOTENCY: "true"
  ORDER_ROUTER_ENFORCE_GLOBAL_KILL_SWITCH: "true"
  ORDER_SUBMISSION_OUTBOX_ENABLED: "true"
  ORDER_SUBMISSION_OUTBOX_REQUIRED: "true"
  ORDER_SUBMISSION_OUTBOX_BACKEND: "postgres"
  POSITION_OWNERSHIP_ENABLED: "true"
  POSITION_OWNERSHIP_UNKNOWN_MODE: "block_entries"
  OWNERSHIP_PERSIST_PENDING_LOCKS: "true"
  ORDER_LIFECYCLE_PERSIST_MARKERS: "true"
  ORDER_LIFECYCLE_PERSIST_MARKERS_REQUIRED: "true"

  ENABLE_EOD_EXIT: "true"
  EOD_EXIT_TIME: "${EOD_EXIT_TIME:-15:20}"
  EOD_EXIT_EXCLUDED_EXCHANGES: "MCX"
  EOD_CANCEL_OPEN_ORDERS_ENABLED: "true"
  CIRCUIT_BREAKER_PERSIST_STATE: "true"

  PROFIT_SWEEP_ENABLED: "true"
  PROFIT_SWEEP_STRATEGY: "SIMPLE"
  PROFIT_SIMPLE_ENABLED: "true"
  PROFIT_MULTIPLE_ENABLED: "false"
  PROFIT_MULTIPLE_TARGET: "${PROFIT_MULTIPLE_TARGET:-500}"
  PROFIT_SWEEP_COOLDOWN_MINUTES: "${PROFIT_SWEEP_COOLDOWN_MINUTES:-30}"
  PROFIT_MAX_SWEEPS_PER_DAY: "${PROFIT_MAX_SWEEPS_PER_DAY:-5}"

  INDICATOR_CSV_ENABLED: "true"
  INDICATOR_CSV_PATH: "/app/logs/indicator_bars.csv"
  EXECUTED_TOKENS_STATE_PATH: "/app/logs/executed_tokens_state.json"
  INDICATOR_POSTGRES_ENABLED: "true"
  INDICATOR_POSTGRES_TABLE: "indicator_bars"
  INDICATOR_POSTGRES_RETENTION_MONTHS: "3"
  INDICATOR_POSTGRES_RETENTION_PRUNE_INTERVAL_SECONDS: "900"

  # Retention policy for operational tables — rows older than these thresholds
  # are purged once per startup in the LIVE cleanup block (non-fatal).
  OUTBOX_RETENTION_DAYS: "90"      # terminal outbox records (TERMINAL_FILL etc.)
  POSITION_RETENTION_DAYS: "90"    # FLAT/NONE position records
  MARKERS_RETENTION_DAYS: "180"    # trade_processed_markers (dedup window)
  INDICATOR_SEED_BARS: "300"
  ORDER_CSV_ENABLED: "true"
  TRADE_CSV_ENABLED: "true"
  TRADE_CSV_PATH: "/app/logs/trades.csv"

  HUB_INSTANCE_NAME: "${HUB_INSTANCE_NAME:-phoenix-live-1}"
  HUB_DEFAULT_TENANT_ID: "${HUB_DEFAULT_TENANT_ID:-tenant-1}"
  HUB_DEFAULT_BROKER_ACCOUNT_ID: "${HUB_DEFAULT_BROKER_ACCOUNT_ID:-A1}"
  # HUB_ROUTES_JSON is intentionally absent from this LIVE manifest.
  # TRADE_MODE=LIVE requires Postgres-exclusive routing authority; env-defined
  # routing is forbidden and will cause a fatal startup error if HUB_ROUTES_JSON
  # is set here. Routes must be configured as enabled strategy_configs rows in
  # the Postgres control-plane DB before deployment.

  NIFTY_EMA20_LOTS: "${NIFTY_EMA20_LOTS:-1}"
  BANKNIFTY_EMA20_LOTS: "${BANKNIFTY_EMA20_LOTS:-1}"
  FINNIFTY_EMA20_LOTS: "${FINNIFTY_EMA20_LOTS:-1}"
  MIDCPNIFTY_EMA20_LOTS: "${MIDCPNIFTY_EMA20_LOTS:-1}"
  SENSEX_EMA20_LOTS: "${SENSEX_EMA20_LOTS:-1}"
  NG_EMA20_LOTS: "${NG_EMA20_LOTS:-1}"

  # Issue #223: per-instrument entry cooloff for ema20_strategy. Default in
  # code = one bar (signal_timeframe seconds, 300 for 5-min strategies).
  # Override per symbol below. Set to "0" to disable (NOT recommended for
  # LIVE — see incident 2026-05-08 NATURALGAS22MAY26265CE).
  NIFTY_EMA20_ENTRY_COOLOFF_SECONDS: "${NIFTY_EMA20_ENTRY_COOLOFF_SECONDS:-300}"
  BANKNIFTY_EMA20_ENTRY_COOLOFF_SECONDS: "${BANKNIFTY_EMA20_ENTRY_COOLOFF_SECONDS:-300}"
  FINNIFTY_EMA20_ENTRY_COOLOFF_SECONDS: "${FINNIFTY_EMA20_ENTRY_COOLOFF_SECONDS:-300}"
  MIDCPNIFTY_EMA20_ENTRY_COOLOFF_SECONDS: "${MIDCPNIFTY_EMA20_ENTRY_COOLOFF_SECONDS:-300}"
  SENSEX_EMA20_ENTRY_COOLOFF_SECONDS: "${SENSEX_EMA20_ENTRY_COOLOFF_SECONDS:-300}"
  NG_EMA20_ENTRY_COOLOFF_SECONDS: "${NG_EMA20_ENTRY_COOLOFF_SECONDS:-300}"

  EXCLUSIVE_NIFTY_CE_BUY_TIMEFRAME_SECONDS: "30"
  EXCLUSIVE_NIFTY_CE_BUY_PRESEED_HISTORY: "true"
  EXCLUSIVE_NIFTY_CE_BUY_PRESEED_HISTORY_ROWS: "400"

  NG_SL_PCT: "0.25"
  NG_TP_PCT: "0.35"
  NG_TRAIL_BUFFER_PCT: "0.04"

  ANGEL_FETCH_COOLDOWN_BASE_SECONDS: "5"
  ANGEL_FETCH_COOLDOWN_MAX_SECONDS: "120"
  ANGEL_FETCH_RATE_LIMIT_FLOOR_SECONDS: "90"
  ANGEL_FETCH_BLOCKED_FLOOR_SECONDS: "30"
  ANGEL_FETCH_TIMEOUT_CAP_SECONDS: "60"
  ANGEL_HTTP_TIMEOUT_SECONDS: "25"
  ANGEL_ORDER_PLACE_MAX_ATTEMPTS: "2"
  ANGEL_ORDER_PLACE_RETRY_BASE_SECONDS: "0.5"
  ANGEL_ORDER_CONFIRM_TIMEOUT_SECONDS: "8"
  ANGEL_ORDER_CONFIRM_POLL_SECONDS: "0.8"

  DEFAULT_PROFIT_TARGET_PCT: "0.50"
  DEFAULT_STOPLOSS_PCT: "1.0"

  POSITION_SYNC_INTERVAL_SECONDS: "90"
  POSITION_SYNC_BLOCKED_MIN_INTERVAL_SECONDS: "90"
  ORDERS_SYNC_INTERVAL_SECONDS: "90"

  STREAM_SELF_HEAL_TOKEN_LABELS: "false"
  STREAM_SYNC_EXECUTED_TOKEN_LABELS: "false"
  STREAM_DROP_UNMAPPED_TICKS: "false"
  STREAM_UNMAPPED_TICK_LOG_INTERVAL_SECONDS: "60"

  # ML gate has been removed. ML_ENABLED=false prevents /ml/health from
  # reporting a feature as active when no ML risk control is wired.
  ML_ENABLED: "false"
  ML_MODE: "OFF"

x-db-client-env: &db-client-env
  PGHOST: "${CONTROL_PLANE_PG_HOST:-host.docker.internal}"
  PGPORT: "${CONTROL_PLANE_PG_PORT:-5432}"
  PGDATABASE: "${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB in the current PowerShell session}"
  PGUSER: "${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER in the current PowerShell session}"
  PGPASSWORD: "${CONTROL_PLANE_PG_PASSWORD_HOST:?Set CONTROL_PLANE_PG_PASSWORD_HOST in the current PowerShell session}"
  PGSSLMODE: "${CONTROL_PLANE_PG_SSLMODE:-require}"  # §105
  PGCONNECT_TIMEOUT: "5"
  PHX_MIGRATION_APP_NAME: "phoenix-live-compose"

x-migration-volumes: &migration-volumes
  - ./migrations:/migrations:ro
  - ./scripts/run_migrations.sh:/scripts/run_migrations.sh:ro

services:
  migrator:
    image: postgres:16-alpine
    container_name: phoenix-v9-migrator
    restart: "no"
    environment:
      <<: *db-client-env
    volumes: *migration-volumes
    command:
      - sh
      - -ec
      - |
          sed 's/\r$//' /scripts/run_migrations.sh | sh -s -- apply

  db-preflight:
    image: postgres:16-alpine
    container_name: phoenix-v9-db-preflight
    restart: "no"
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *db-client-env
      PHX_BROKER_ACCOUNT_ID: "${HUB_DEFAULT_BROKER_ACCOUNT_ID:-A1}"
    volumes: *migration-volumes
    command:
      - sh
      - -ec
      - |
          until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do
            echo "Waiting for Postgres $$PGHOST:$$PGPORT/$$PGDATABASE ..."
            sleep 2
          done

          sed 's/\r$//' /scripts/run_migrations.sh | sh -s -- verify

          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.users (
              id TEXT PRIMARY KEY,
              email TEXT NOT NULL,
              name TEXT NOT NULL,
              password_hash TEXT NOT NULL,
              role TEXT NOT NULL,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_users_email ON public.users (lower(email));

          DO $$do$$
          BEGIN
              IF EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'broker_accounts' AND column_name = 'client_code'
              ) THEN
                  CREATE INDEX IF NOT EXISTS idx_broker_accounts_client_code ON public.broker_accounts (client_code);
              END IF;

              IF EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'subscriptions' AND column_name IN ('tenant_id', 'broker_account_id', 'mode')
                  GROUP BY table_name
                  HAVING COUNT(*) = 3
              ) THEN
                  CREATE INDEX IF NOT EXISTS idx_subscriptions_tenant_account_mode
                      ON public.subscriptions (tenant_id, broker_account_id, mode);
              END IF;
          END
          $$do$$;
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$do$$
          DECLARE
              missing text;
          BEGIN
              SELECT string_agg(name, ', ' ORDER BY name) INTO missing
              FROM (
                  SELECT required_table AS name
                  FROM (VALUES
                      ('tenants'),
                      ('broker_accounts'),
                      ('subscriptions'),
                      ('strategy_configs'),
                      ('strategy_config_candidates'),
                      ('broker_credentials')
                  ) AS req(required_table)
                  WHERE NOT EXISTS (
                      SELECT 1
                      FROM information_schema.tables t
                      WHERE t.table_schema = 'public'
                        AND t.table_name = req.required_table
                  )

                  UNION ALL

                  SELECT required_index AS name
                  FROM (VALUES
                      ('idx_broker_accounts_client_code'),
                      ('idx_subscriptions_tenant_account_mode'),
                      ('idx_users_email'),
                      ('idx_strategy_config_candidates_cfg_status'),
                      ('idx_strategy_config_candidates_created_at')
                  ) AS req(required_index)
                  WHERE NOT EXISTS (
                      SELECT 1
                      FROM pg_indexes i
                      WHERE i.schemaname = 'public'
                        AND i.indexname = req.required_index
                  )
              ) x;

              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'Missing required schema objects: %', missing;
              END IF;
          END
          $$do$$;
          SQL

          psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM public.broker_credentials WHERE broker_account_id = '$$PHX_BROKER_ACCOUNT_ID' LIMIT 1" | grep -q 1 || {
            echo "Missing broker_credentials row for broker_account_id=$$PHX_BROKER_ACCOUNT_ID"
            exit 1
          }

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoenix-v9-backend:live
    container_name: phoenix-v9-backend
    init: true
    restart: unless-stopped
    depends_on:
      db-preflight:
        condition: service_completed_successfully
    expose:
      - "8080"
    environment:
      <<: *live-backend-env
    # Sensitive secrets are mounted as files and loaded by docker-entrypoint.sh
    # so they do NOT appear in `docker inspect phoenix-v9-backend` output.
    secrets:
      - admin_api_key
      - demo_auth_token_secret
      - control_plane_pg_password
      # §126: Required for Angel broker postback authentication.
      # LIVE mode forces ANGEL_POSTBACK_AUTH_MODE=direct_broker; without this
      # token all Angel postbacks return HTTP 401 and lifecycle misses fill events.
      - angel_postback_token
      - admin_kill_switch_override
    volumes:
      # PHOENIX_LOG_HOST_PATH controls where container logs land on the host.
      # Default ./logs keeps backward compatibility for existing deployments.
      # For production, override to a path OUTSIDE the repo to prevent test
      # output from local pytest runs contaminating production log files.
      # Example: export PHOENIX_LOG_HOST_PATH=/var/log/phoenix
      - "${PHOENIX_LOG_HOST_PATH:-./logs}:/app/logs"
      # PHOENIX_STATE_HOST_PATH is the host path for the risk state file.
      # Separate from the log volume so risk state is not lost if logs are rotated.
      # Example: export PHOENIX_STATE_HOST_PATH=/var/lib/phoenix/state
      - "${PHOENIX_STATE_HOST_PATH:-./state}:/app/state"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: phoenix-v9-web:live
    container_name: phoenix-v9-web
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    # ADMIN_API_KEY is loaded from /run/secrets/admin_api_key by the
    # nginx entrypoint - not passed via environment to avoid docker inspect exposure.
    secrets:
      - admin_api_key
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# Docker secrets: files written and retained by start-docker-secretstore.ps1
# at PHX_SECRET_DIR (e.g. $env:TEMP\phx-secrets). Compose local secrets are
# bind-mounted files, so they must exist for the lifetime of the stack.
# Mounting as secrets prevents values appearing in `docker inspect` output.
# The migrator/db-preflight containers use PGPASSWORD via PowerShell session
# as they are ephemeral one-shot containers.
secrets:
  admin_api_key:
    file: "${PHX_SECRET_DIR}/admin_api_key"
  demo_auth_token_secret:
    file: "${PHX_SECRET_DIR}/demo_auth_token_secret"
  control_plane_pg_password:
    file: "${PHX_SECRET_DIR}/control_plane_pg_password"
  angel_postback_token:
    file: "${PHX_SECRET_DIR}/angel_postback_token"
  admin_kill_switch_override:
    file: "${PHX_SECRET_DIR}/admin_kill_switch_override"
