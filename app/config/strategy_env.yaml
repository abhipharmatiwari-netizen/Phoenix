delta:
  delta_qty_per_leg: 1
  delta_qty_per_leg_by_underlying:
    NIFTY: 1
    BANKNIFTY: 1
    FINNIFTY: 1
    MIDCPNIFTY: 1
    SENSEX: 1

risk:
  capital_auto_resize_enabled: true
  max_open_spreads_per_underlying: 1
  max_daily_loss: 1500
  max_intraday_drawdown: 2000
  kill_switch_square_off_open_positions: true
  risk_limits:
    default:
      max_lots_per_trade: 1
      max_open_lots: 1
      max_notional_per_underlying: null
    per_underlying:
      NIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      BANKNIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      FINNIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      MIDCPNIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      SENSEX:
        max_lots_per_trade: 1
        max_open_lots: 1
      NG:
        max_lots_per_trade: 1
        max_open_lots: 1
  per_underlying:
    NG: 1
    NIFTY: 1
    BANKNIFTY: 1
    FINNIFTY: 1
    SENSEX: 1
    MIDCPNIFTY: 1

vol_thresholds:
  NIFTY_IDX:
    low_max: 0.0006
    med_max: 0.0016
  BANKNIFTY_IDX:
    low_max: 0.0007
    med_max: 0.0015
  FINNIFTY_IDX:
    low_max: 0.0007
    med_max: 0.0015
  SENSEX_IDX:
    low_max: 0.0006
    med_max: 0.0014
  MIDCPNIFTY_IDX:
    low_max: 0.0008
    med_max: 0.0016
  NG_FUT:
    low_max: 0.0012
    med_max: 0.0022

strategies:
  - name: delta_strangle
    enabled: true
    instruments: ["NIFTY_IDX", "BANKNIFTY_IDX"]
    params:
      sl_pct: 0.30
      tp_pct: 0.30
  - name: option_strategy
    enabled: true
    instruments:
      - "NIFTY_IDX"
      - "BANKNIFTY_IDX"
      - "FINNIFTY_IDX"
      - "SENSEX_IDX"
      - "MIDCPNIFTY_IDX"
      - "NG_FUT"
  - name: ema20_strategy
    enabled: true
    instruments:
      - "NIFTY_IDX"
    params:
      ema_period: 20
      timeframe_seconds: 300
      min_atr: 25.0                  # optimized: was 45.0 — too restrictive (6/19 days)
      require_rsi_falling: true
      use_adx_filter: false
      adx_period: 14
      min_adx: 18.0
      require_bearish_di: true
      min_di_spread: 0.0
      first_entry_time: "9:30"
      square_off_time: "15:00"
      sl_pct: 0.20
      tp_pct: 0.30
      trail_buffer_pct: 0.05
      trail_trigger_pct: 0.10
      dynamic_policy:
        enabled: true
        policy_id: "ema20_nifty_v1"
        freeze_on_entry: true
        hold_bars: 3
        min_regime_hold_minutes: 0
        thresholds:
          adx_trend: 24
          di_spread_trend: 4
          ema_slope_trend_min: 0.0005
          atr_norm_high: 1.45
          atr_norm_secondary: 1.2
