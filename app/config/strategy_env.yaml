    enabled: true
    allowed_strategies: ["ema20_strategy", "exclusive_nifty_ce_buy", "put_momentum_scalper"]
  BANKNIFTY_IDX:
    enabled: true
    allowed_strategies: ["ema20_strategy", "put_momentum_scalper"]
  FINNIFTY_IDX:
    enabled: false
    allowed_strategies: ["ema20_strategy"]
  MIDCPNIFTY_IDX:
    enabled: false
    allowed_strategies: ["ema20_strategy"]
  SENSEX_IDX:
    enabled: false
    allowed_strategies: ["ema20_strategy"]
  NG_FUT:
    enabled: true
    allowed_strategies: ["ema20_strategy"]

strategy_selection:
  enabled: true
  max_active_per_underlying: 2
  min_hold_seconds: 180
  # Authority rule (EMA20-5): EMA20 dynamic policy is the authoritative layer for
  # EMA20 entry permissibility. When ema20_is_authoritative=true, ema20_strategy
  # bypasses selector regime gating and is governed solely by its own per-regime
  # dynamic profiles (disable_entries flag). This resolves the design conflict where
  # selector NO_TRADE->[] suppressed EMA20 even when EMA20's NO_TRADE profile had
  # disable_entries=false (incident: NIFTY/BANKNIFTY March 13, 2026).
  # To reintroduce selector control over EMA20, set this to false AND align the
  # selector mapping NO_TRADE entry with EMA20's dynamic profile before LIVE use.
  ema20_is_authoritative: true
  mapping:
    NIFTY_IDX:
      # Keep EXCLUSIVE_CE on bar dispatch across all regimes; its own dynamic
      # policy decides whether entries are allowed, and it still needs bars for
      # diagnostics and private EMA maintenance when entries are disabled.
      TRENDING: ["put_momentum_scalper", "exclusive_nifty_ce_buy"]
      NORMAL: ["ema20_strategy", "exclusive_nifty_ce_buy"]
      CHOPPY: ["ema20_strategy", "exclusive_nifty_ce_buy"]
      HIGH_VOL: ["put_momentum_scalper", "exclusive_nifty_ce_buy"]
      NO_TRADE: ["exclusive_nifty_ce_buy"]
    BANKNIFTY_IDX:
      TRENDING: ["put_momentum_scalper"]
      NORMAL: ["ema20_strategy"]
      CHOPPY: ["ema20_strategy"]
      HIGH_VOL: ["put_momentum_scalper"]
      NO_TRADE: []
    NG_FUT:
      TRENDING: ["ema20_strategy"]
      NORMAL: ["ema20_strategy"]
      CHOPPY: ["ema20_strategy"]
      HIGH_VOL: ["ema20_strategy"]
      NO_TRADE: []

