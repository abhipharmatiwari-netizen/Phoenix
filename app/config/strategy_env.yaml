  tp_pct: 0.30
  trail_buffer_pct: 0.05

  max_open_spreads: 2

  vol_low_atr_norm: 0.0007
  vol_high_atr_norm: 0.0015

  neutral_template: "SHORT_STRANGLE"
  directional_template_ce: "SHORT_CE"
  directional_template_pe: "SHORT_PE"

  lot_size: 60
  qty_per_trade: 1

  role_labels:
    strangle_ce_label: null
    strangle_pe_label: null

