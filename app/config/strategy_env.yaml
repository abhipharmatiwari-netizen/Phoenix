# strategy_env.yaml

ng:
  enabled: true
  signal_timeframe: 300
  min_atr: 2.0
  rsi_upper: 75.0
  rsi_lower: 30.0
  use_rsi_filter: true
  ema_period: 8
  ema20_require_rsi_falling: false

  sl_pct: 0.20
  tp_pct: 0.30
  trail_buffer_pct: 0.08
  trail_trigger_pct: 0.25

  max_open_spreads: 1

  vol_low_atr_norm: 0.0011      # LOW / MED threshold
  vol_high_atr_norm: 0.0020    # MED / HIGH threshold

  neutral_template: "SHORT_STRADDLE"         # or "SHORT_STRANGLE"
  directional_template_ce: "SHORT_CE"
  directional_template_pe: "SHORT_PE"

  lot_size: 1
  qty_per_trade: 1

  role_labels:
    strangle_ce_label: "NG_OTM_CE_???"
    strangle_pe_label: "NG_OTM_PE_???"

nifty:
  options_enabled: true
  delta_enabled: false
  signal_timeframe: 300
  min_atr: 1.8
  rsi_upper: 60.0
  rsi_lower: 40.0
  use_rsi_filter: true
  ema_period: 20

  sl_pct: 0.20
  tp_pct: 0.30
  trail_buffer_pct: 0.03

  max_open_spreads: 1

  vol_low_atr_norm: 0.0005      # tune via vol_calibration.py
  vol_high_atr_norm: 0.0014

  neutral_template: "SHORT_STRANGLE"         # e.g. strangle in low vol
  directional_template_ce: "SHORT_CE"
  directional_template_pe: "SHORT_PE"

  lot_size: 65
  qty_per_trade: 1

  role_labels:
    # e.g. if you want NIFTY short strangle, set these to real labels:
    # strangle_ce_label: "NIFTY_OTM_CE_24000"
    # strangle_pe_label: "NIFTY_OTM_PE_22000"
    strangle_ce_label: null
    strangle_pe_label: null

banknifty:
  options_enabled: true
  delta_enabled: false
  signal_timeframe: 300
  min_atr: 2.0        # tuned for wider participation
  rsi_upper: 65.0
  rsi_lower: 40.0
  use_rsi_filter: true
  ema_period: 20

  sl_pct: 0.20
  tp_pct: 0.30
  trail_buffer_pct: 0.05

  max_open_spreads: 1

  vol_low_atr_norm: 0.0006
  vol_high_atr_norm: 0.0013

  neutral_template: "SHORT_STRANGLE"
  directional_template_ce: "SHORT_CE"
  directional_template_pe: "SHORT_PE"

  lot_size: 30
  qty_per_trade: 1

  role_labels:
    strangle_ce_label: null
    strangle_pe_label: null

finnifty:
