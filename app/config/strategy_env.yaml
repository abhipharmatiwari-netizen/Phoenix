delta:
  delta_qty_per_leg: 1
  delta_qty_per_leg_by_underlying:
    NIFTY: 1
    BANKNIFTY: 1
    FINNIFTY: 1
    MIDCPNIFTY: 1
    SENSEX: 1

risk:
  capital_auto_resize_enabled: true
  max_open_spreads_per_underlying: 1
  max_daily_loss: 1500
  max_intraday_drawdown: 2000
  kill_switch_square_off_open_positions: true
  risk_limits:
    default:
      max_lots_per_trade: 1
      max_open_lots: 1
      max_notional_per_underlying: null
    per_underlying:
      NIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      BANKNIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      FINNIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      MIDCPNIFTY:
        max_lots_per_trade: 1
        max_open_lots: 1
      SENSEX:
        max_lots_per_trade: 1
        max_open_lots: 1
      NG:
        max_lots_per_trade: 1
        max_open_lots: 1
  per_underlying:
    NG: 1
    NIFTY: 1
    BANKNIFTY: 1
    FINNIFTY: 1
    SENSEX: 1
    MIDCPNIFTY: 1

vol_thresholds:
  NIFTY_IDX:
    low_max: 0.0006
    med_max: 0.0016
  BANKNIFTY_IDX:
    low_max: 0.0007
    med_max: 0.0015
  FINNIFTY_IDX:
    low_max: 0.0007
    med_max: 0.0015
  SENSEX_IDX:
    low_max: 0.0006
    med_max: 0.0014
  MIDCPNIFTY_IDX:
    low_max: 0.0008
    med_max: 0.0016
  NG_FUT:
