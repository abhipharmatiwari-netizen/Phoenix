  NG_FUT:
    enabled: true
    allowed_strategies: ["ema20_strategy"]

strategy_selection:
  enabled: true
  max_active_per_underlying: 1
  min_hold_seconds: 180
  # Live operator override 2026-06-03: only ema20_strategy may be selected.
  # Non-EMA strategies remain defined for historical/backtest context, but are
  # disabled above and intentionally absent from live allow-lists and mappings.
  ema20_is_authoritative: true
  ema20_authoritative_underlyings: ["NIFTY_IDX"]
  mapping:
    NIFTY_IDX:
      # Current EMA20-only override supersedes the historical multi-strategy
      # notes below. The active mapping lines are authoritative.
      # Notes on this mapping (revised after Codex review on PR #211):
      #
      # 1. `ema20_strategy` is OMITTED from every regime list. With
      #    ema20_authoritative_underlyings=["NIFTY_IDX"] (above), ema20 receives bars via
      #    the bypass at multi_instrument_stream._is_strategy_selected
      #    regardless of whether it appears here. Listing it here would
      #    consume one of the slots under
      #    auto_strategy_max_active_per_underlying (env default = 2,
      #    overrides this YAML's max_active_per_underlying: 3) and would
      #    truncate other strategies out of selection.
      #
      # 2. `nifty_weekly_credit_spreads` is placed FIRST in every list
      #    so it survives the cap=2 truncation in TRENDING / HIGH_VOL.
      #    Without this, the selector returns selection[:2] = the first
      #    two entries; placing the spread last (the obvious append
      #    position) silently truncated it back to selector_blocked --
      #    the exact failure mode the prior round of this PR was
      #    supposed to fix.
      #
      # 3. `nifty_weekly_credit_spreads` is OMITTED from NO_TRADE
      #    entirely. Unlike `exclusive_nifty_ce_buy` (which has its
      #    own dynamic_policy.profiles.NO_TRADE.disable_entries
      #    handling), the spread strategy's _maybe_enter has no
      #    selector-regime awareness; if dispatched in NO_TRADE its
      #    own time-window + ATR + RSI + MACD gates can still pass
      #    and it would silently fire entries. Cost: no DEBUG
      #    diagnostics for the spread in NO_TRADE bars; acceptable
      #    because NO_TRADE means "do nothing" and the regime is
      #    typically transient.
      #
      # 4. EXCLUSIVE_CE remains in every non-NO_TRADE regime (the
      #    pre-existing comment about diagnostics + indicator
      #    maintenance applies). Behavioural change vs the earlier
      #    cut: in TRENDING / HIGH_VOL EXCLUSIVE_CE is now position 2
      #    of 3, so under cap=2 selection is [spread, put_momentum]
      #    and EXCLUSIVE_CE is the truncated one. Acceptable because
      #    EXCLUSIVE_CE's private-30s-EMA dependency is unfilled in
      #    replay (#214) and direction-filtering already blocks it
      #    on bear days; promoting the spread here is the higher-
      #    value choice for this PR's diagnostic goal.
      #
      # 5. TRENDING_UP / TRENDING_DOWN keys (issue #212) make the
      #    direction-conditional intent explicit. Each split lists THREE
      #    strategies — direction-matched first, opposite-direction
      #    second, spread third:
      #      - TRENDING_UP:   [exclusive_nifty_ce_buy (long CE), put_momentum_scalper, spread]
      #      - TRENDING_DOWN: [put_momentum_scalper (long PE), exclusive_nifty_ce_buy, spread]
      #
      #    ==================================================================
      #    REQUIRED: AUTO_STRATEGY_MAX_ACTIVE_PER_UNDERLYING >= 3
      #    ==================================================================
      #    The selector truncates the per-regime list to
      #    ``AUTO_STRATEGY_MAX_ACTIVE_PER_UNDERLYING`` items, so a cap
      #    below 3 would drop the spread strategy out of the selection
      #    and a spread opened during NORMAL/CHOPPY/HIGH_VOL that is
      #    carried into TRENDING_UP/DOWN would lose its SL/TP/EOD
      #    management.
      #
      #    The committed default in ``app/config/settings.py`` was raised
      #    from 2 -> 3 (issue #212 / PR #265 round-4) to make this the
      #    safe default for any deployment that does not explicitly set
      #    the env var. The OCI live env example
      #    (``docs/runbooks/oci-live.env.example``) also pins 3 so
      #    operator-edited copies inherit the correct value.
      #    Codex round-2 P1 on PR #265 drove this enforcement: a
      #    comment-only operator note was insufficient because unversioned
      #    env files could silently miss the override.
      #    ==================================================================
      #
      #    With cap=3 in effect:
      #      - Position-1 dispatch precedence ensures only the
      #        direction-matched side gets new ENTRY dispatch when the
      #        cap is reduced to 1.
      #      - The OPPOSITE-direction strategy stays selected for
      #        SL/TP/EOD management of any open position from the prior
      #        regime (its internal direction-gate self-rejects new
      #        entries on the wrong side; PR #265 Codex round-1 P1 fix).
      #      - The spread stays selected for SL/TP/EOD management of
      #        any open spread carried across the flip (PR #265 Codex
      #        round-2 P1 fix).
      #
      #    Set-membership of the cap=3 selection is identical between
      #    TRENDING_UP and TRENDING_DOWN — only the ordering differs.
      #    A fast bull->bear flip during the
      #    AUTO_STRATEGY_MIN_HOLD_SECONDS hold window therefore does
      #    not change the actively-dispatched strategy SET; the hold
      #    cannot defer management coverage (PR #265 Codex round-1
      #    P2 #2 fix).
      #
      #    Legacy TRENDING is retained for backward compatibility when
      #    the classifier cannot resolve direction (missing +DI/-DI/EMA/
      #    slope ctx fields — see
      #    RegimeClassifier._directional_trending_regime).
      # PR #265 round-6 (Codex round-5 P2 "Preserve legacy TRENDING
      # truncation when raising the cap"): legacy TRENDING was originally
      # a 3-entry list that the env-default cap=2 truncated to
      # ``[spread, put_momentum_scalper]``. Round-4 raised the committed
      # cap to 3 (so the direction-aware splits fit), but that also
      # dropped the implicit cap=2 truncation on the direction-ambiguous
      # TRENDING fallback path. Trim legacy TRENDING back to 2 entries so
      # fallback dispatch matches the pre-#265 behaviour and the
      # operator's documented intent ("EXCLUSIVE_CE is the truncated one"
      # in the comment block above).
      #
      # PR #265 Codex P1 follow-up: keep exclusive_nifty_ce_buy selected
      # in HIGH_VOL as the third cap=3 member. A CE can now be opened in
      # TRENDING_UP, and selector membership gates the strategy's on_bar /
      # on_tick stop, trail, and EOD management. HIGH_VOL can follow a
      # bullish trend, so dropping CE there would leave the open CE
      # unmanaged. Keep spread + put first to preserve the historical
      # cap=2 prefix; the startup validator requires cap >= 3 when the
      # selector is enabled so the management member is not truncated.
      TRENDING: ["ema20_strategy"]
      TRENDING_UP: ["ema20_strategy"]
      TRENDING_DOWN: ["ema20_strategy"]
      NORMAL: ["ema20_strategy"]
      CHOPPY: ["ema20_strategy"]
      HIGH_VOL: ["ema20_strategy"]
      NO_TRADE: []
    BANKNIFTY_IDX:
      # Current EMA20-only override: no put momentum dispatch in live mode.
      # Issue #266: direction-aware split mirroring the NIFTY pattern.
      # BANKNIFTY has no native bullish strategy in the current lineup
      # (both put_momentum_scalper and ema20_strategy are bear-biased),
      # so TRENDING_UP is intentionally empty — explicit no-trade on
      # bull-trend BANKNIFTY days. Legacy TRENDING is retained as the
      # backward-compatible fallback when MarketContext direction
      # fields are unavailable (rare, but matches the NIFTY pattern).
      # Cross-flip management caveat: an open position from
      # TRENDING_DOWN that carries into TRENDING_UP loses dispatch
      # (is_strategy_active -> False -> on_bar/on_tick not invoked).
      # Operator-acknowledged risk; same as the NIFTY design choice.
      TRENDING: ["ema20_strategy"]
      TRENDING_UP: ["ema20_strategy"]
      TRENDING_DOWN: ["ema20_strategy"]
      NORMAL: ["ema20_strategy"]
      CHOPPY: ["ema20_strategy"]
      HIGH_VOL: ["ema20_strategy"]
      NO_TRADE: []
    NG_FUT:
      # Current EMA20-only override: EMA20 is the only selectable live strategy.
      # Issue #266: make the direction split explicit. ema20_strategy
      # is bear-biased (close < EMA20 + RSI falling) so it self-rejects
      # on bull-trend NG bars; TRENDING_UP: [] documents the no-trade-
      # on-bull intent so the selector does not silently fall through
      # to the legacy TRENDING list (which also no longer exists for
      # NG_FUT after this change). The classifier will emit
      # TRENDING_UP/TRENDING_DOWN when ADX + DI conditions are met,
      # and the empty TRENDING_UP key makes the selector resolution
      # deterministic.
      TRENDING: ["ema20_strategy"]
      TRENDING_UP: ["ema20_strategy"]
      TRENDING_DOWN: ["ema20_strategy"]
      NORMAL: ["ema20_strategy"]
      CHOPPY: ["ema20_strategy"]
      HIGH_VOL: ["ema20_strategy"]
      NO_TRADE: []

