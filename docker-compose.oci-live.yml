# Oracle Cloud Infrastructure (OCI) LIVE manifest
#
# Differences from docker-compose.live.single.yml:
#   - Images pulled from OCI Container Registry (OCIR) â€” no local build
#   - No local `db` or `db-preflight` postgres service â€” uses OCI Database for PostgreSQL
#   - CONTROL_PLANE_PG_HOST points to OCI DB private endpoint
#   - REMOTE_DEPLOYMENT=true triggers hard-abort on LIVE_PG_SSL_SKIP_CHECK
#   - Secrets sourced from /run/secrets/ (written by scripts/fetch-secrets.sh via OCI Vault)
#   - Volume mounts use OCI File Storage NFS paths
#   - nginx binds 0.0.0.0:80 (OCI Load Balancer forwards to port 80)
#   - DISABLE_CONTROL_TOWER_ROUTES=true (never expose control tower on cloud)
#   - LIVE_PG_SSL_SKIP_CHECK always false (OCI DB has SSL)
#   - POSTGRES_FORCE_IPV4 disabled (OCI private DNS resolves correctly)
#
# Usage:
#   scripts/fetch-secrets.sh          # pull secrets from OCI Vault
#   docker compose -f docker-compose.oci-live.yml run --rm migrator
#   docker compose -f docker-compose.oci-live.yml run --rm db-preflight
#   docker compose -f docker-compose.oci-live.yml up -d
#
# Required environment variables (set in shell before running):
#   OCIR_NAMESPACE          OCI tenancy namespace (e.g. fra12abc34xyz)
#   OCIR_REGION             OCI region (e.g. ap-mumbai-1)
#   CONTROL_PLANE_PG_HOST   OCI DB private endpoint hostname
#   CONTROL_PLANE_PG_DB     database name (typically: phoenix)
#   CONTROL_PLANE_PG_USER   application DB user (typically: phoenix_app)
#   HUB_DEFAULT_TENANT_ID   production tenant UUID (must be explicit, no default)
#   CAPITAL_LIMITS_JSON     per-account capital limits JSON
#   RISK_MAX_DAILY_LOSS     daily loss ceiling in INR
#   PROFIT_DAILY_TARGET     daily profit target in INR
#   CLIENT_LOCAL_IP         broker network identity
#   CLIENT_PUBLIC_IP        broker network identity
#   MAC_ADDRESS             broker network identity

name: phoenix-oci-live

x-ocir-base: &ocir-base "${OCIR_REGION:-ap-mumbai-1}.ocir.io/${OCIR_NAMESPACE:?Set OCIR_NAMESPACE}/phoenix-prod"

x-db-env: &db-env
  CONTROL_PLANE_PG_HOST: "${CONTROL_PLANE_PG_HOST:?Set CONTROL_PLANE_PG_HOST to OCI DB private endpoint}"
  CONTROL_PLANE_PG_PORT: "${CONTROL_PLANE_PG_PORT:-5432}"
  CONTROL_PLANE_PG_DB: "${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB}"
  CONTROL_PLANE_PG_USER: "${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER}"
  CONTROL_PLANE_PG_SSLMODE: "require"
  # OCI DB SSL CA certificate path inside container.
  # Mount the OCI CA bundle at /app/certs/oci-pg-ca.pem via the certs volume.
  # Download from: https://docs.oracle.com/en-us/iaas/Content/PostgreSQL/Concepts/postgresqlconnecting.htm
  CONTROL_PLANE_DB_DSN: "postgresql://${CONTROL_PLANE_PG_USER}@${CONTROL_PLANE_PG_HOST}:${CONTROL_PLANE_PG_PORT:-5432}/${CONTROL_PLANE_PG_DB}?sslmode=require&sslrootcert=/app/certs/oci-pg-ca.pem"
  POSTGRES_FORCE_IPV4: "false"
  POSTGRES_CONNECT_TIMEOUT_SECONDS: "10"
  POSTGRES_SESSION_TIMEZONE: "Asia/Kolkata"
  # Signals hard-abort if LIVE_PG_SSL_SKIP_CHECK is accidentally set to true.
  REMOTE_DEPLOYMENT: "true"
  LIVE_PG_SSL_SKIP_CHECK: "false"

x-live-backend-env: &live-backend-env
  <<: *db-env
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_TICKS: "0"
  UNIVERSE_LOG_FULL_LIST: "0"
  CLIENT_LOCAL_IP: "${CLIENT_LOCAL_IP:?Set CLIENT_LOCAL_IP at deploy time}"
  CLIENT_PUBLIC_IP: "${CLIENT_PUBLIC_IP:?Set CLIENT_PUBLIC_IP at deploy time}"
  MAC_ADDRESS: "${MAC_ADDRESS:?Set MAC_ADDRESS at deploy time}"
  TZ: "Asia/Kolkata"
  DEFAULT_TIME_ZONE: "Asia/Kolkata"
  LOG_FILE_PER_PROCESS: "true"
  RUNNER_MODE: "uvicorn"
  HOST: "0.0.0.0"
  PORT: "8080"
  BACKEND_URL: "http://127.0.0.1:8080"
  CORS_ORIGINS: "https://${PHOENIX_DOMAIN:?Set PHOENIX_DOMAIN to the production domain}"

  CONTROL_PLANE_BACKEND: "postgres"
  SWEEP_STATE_BACKEND: "postgres"
  BROKER_SECRET_BACKEND: "postgres"

  APP_RUNTIME_STARTUP_VALIDATE: "true"
  SCHEMA_CHECK_MODE: "strict"
  BROKER_SCHEMA_CHECK_MODE: "strict"
  RUNTIME_CONFIG_AUTO_ENABLE: "false"
  RUNTIME_CONFIG_ENABLED: "false"

  ENABLE_DEMO_AUTH: "false"
  DASHBOARD_AUTH_DISABLED: "false"
  # Control tower routes are disabled on OCI â€” never expose strategy selector matrix
  # directly from cloud-hosted deployments.
  DISABLE_CONTROL_TOWER_ROUTES: "true"

  ENABLE_MULTI_HUB: "true"
  USE_HUB_ROUTER: "true"
  DISABLE_STREAM_WORKER: "false"
  LEADER_LEASE_ENABLED: "true"
  LEADER_LEASE_BACKEND: "postgres"
  LEADER_LEASE_ID: "${LEADER_LEASE_ID:-phoenix-oci-live}"
  USE_HUB_ROUTER_FOR_NIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_BANKNIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_FINNIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_SENSEX_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_MIDCPNIFTY_OPTIONS: "true"
  USE_HUB_ROUTER_FOR_NG_OPTIONS: "true"
  AUTO_STRATEGY_SELECT_ENABLED: "true"
  AUTO_STRATEGY_MAX_ACTIVE_PER_UNDERLYING: "${AUTO_STRATEGY_MAX_ACTIVE_PER_UNDERLYING:-2}"
  AUTO_STRATEGY_MIN_HOLD_SECONDS: "${AUTO_STRATEGY_MIN_HOLD_SECONDS:-180}"

  TRADE_MODE: "LIVE"
  REQUIRE_LIVE_TRADE_MODE: "true"
  RISK_STATE_PATH: "/app/state/risk_positions.json"
  DISABLE_TRADING_WINDOW_FILTER: "false"

  ENABLE_CAPITAL_CHECKS: "true"
  ALLOW_LIVE_CAPITAL_CHECKS_DISABLED: "false"
  # CAPITAL_LIMITS_JSON must contain real per-account limits â€” never leave as {}.
  # Format: {"<tenant_id>:<account_id>":{"max_gross_exposure":N,"max_net_exposure":N}}
  # Set via phoenix-deploy.env on the OCI VM; retrieve limits from ops planning docs.
  CAPITAL_LIMITS_JSON: "${CAPITAL_LIMITS_JSON:?Set CAPITAL_LIMITS_JSON with real per-account limits}"
  CAPITAL_FAIL_CLOSED_ON_MISSING_STATE: "true"
  CAPITAL_FAIL_CLOSED_ON_MISSING_NOTIONAL_PRICE: "true"
  CAPITAL_MARGIN_SHORT_OPTION_PER_LOT: "200000"
  CAPITAL_MARGIN_FUTURES_PER_LOT: "200000"
  CAPITAL_MARGIN_FUTURES_RATE: "0.12"
  CAPITAL_MARGIN_CHECK_MODE: "enforce"

  ENABLE_RISK_CHECKS: "true"
  RISK_ENABLE_DAILY_LOSS: "true"
  RISK_MAX_DAILY_LOSS: "${RISK_MAX_DAILY_LOSS:?Set RISK_MAX_DAILY_LOSS}"
  RISK_FAIL_OPEN_ON_MISSING_PNL: "false"

  ENABLE_PROFIT_CHECKS: "true"
  PROFIT_ENABLE_DAILY_TARGET: "true"
  PROFIT_DAILY_TARGET: "${PROFIT_DAILY_TARGET:?Set PROFIT_DAILY_TARGET}"
  PROFIT_BLOCK_NEW_ORDERS_ON_TARGET: "true"

  ORDER_ROUTER_ENFORCE_IDEMPOTENCY: "true"
  ORDER_SUBMISSION_OUTBOX_ENABLED: "true"
  ORDER_SUBMISSION_OUTBOX_REQUIRED: "true"
  ORDER_SUBMISSION_OUTBOX_BACKEND: "postgres"
  POSITION_OWNERSHIP_ENABLED: "true"
  POSITION_OWNERSHIP_UNKNOWN_MODE: "block_entries"
  OWNERSHIP_PERSIST_PENDING_LOCKS: "true"
  ORDER_LIFECYCLE_PERSIST_MARKERS: "true"
  ORDER_LIFECYCLE_PERSIST_MARKERS_REQUIRED: "true"

  ENABLE_EOD_EXIT: "true"
  EOD_EXIT_TIME: "${EOD_EXIT_TIME:-15:20}"
  EOD_EXIT_EXCLUDED_EXCHANGES: "MCX"
  EOD_CANCEL_OPEN_ORDERS_ENABLED: "true"
  CIRCUIT_BREAKER_PERSIST_STATE: "true"

  PROFIT_SWEEP_ENABLED: "true"
  PROFIT_SWEEP_STRATEGY: "SIMPLE"
  PROFIT_SIMPLE_ENABLED: "true"
  PROFIT_MULTIPLE_ENABLED: "false"
  PROFIT_MULTIPLE_TARGET: "${PROFIT_MULTIPLE_TARGET:-500}"
  PROFIT_SWEEP_COOLDOWN_MINUTES: "${PROFIT_SWEEP_COOLDOWN_MINUTES:-30}"
  PROFIT_MAX_SWEEPS_PER_DAY: "${PROFIT_MAX_SWEEPS_PER_DAY:-5}"

  INDICATOR_CSV_ENABLED: "true"
  INDICATOR_CSV_PATH: "/app/logs/indicator_bars.csv"
  EXECUTED_TOKENS_STATE_PATH: "/app/logs/executed_tokens_state.json"
  INDICATOR_POSTGRES_ENABLED: "true"
  INDICATOR_POSTGRES_TABLE: "indicator_bars"
  INDICATOR_POSTGRES_RETENTION_MONTHS: "3"
  INDICATOR_POSTGRES_RETENTION_PRUNE_INTERVAL_SECONDS: "900"

  OUTBOX_RETENTION_DAYS: "90"
  POSITION_RETENTION_DAYS: "90"
  MARKERS_RETENTION_DAYS: "180"
  INDICATOR_SEED_BARS: "300"
  ORDER_CSV_ENABLED: "true"
  TRADE_CSV_ENABLED: "true"
  TRADE_CSV_PATH: "/app/logs/trades.csv"

  HUB_INSTANCE_NAME: "${HUB_INSTANCE_NAME:-phoenix-oci-prod}"
  # HUB_DEFAULT_TENANT_ID must be the real production tenant UUID.
  # The startup validator rejects 'tenant-default' and an empty value.
  HUB_DEFAULT_TENANT_ID: "${HUB_DEFAULT_TENANT_ID:?Set HUB_DEFAULT_TENANT_ID to production tenant UUID}"
  HUB_DEFAULT_BROKER_ACCOUNT_ID: "${HUB_DEFAULT_BROKER_ACCOUNT_ID:?Set HUB_DEFAULT_BROKER_ACCOUNT_ID}"

  NIFTY_EMA20_LOTS: "${NIFTY_EMA20_LOTS:-1}"
  BANKNIFTY_EMA20_LOTS: "${BANKNIFTY_EMA20_LOTS:-1}"
  FINNIFTY_EMA20_LOTS: "${FINNIFTY_EMA20_LOTS:-1}"
  MIDCPNIFTY_EMA20_LOTS: "${MIDCPNIFTY_EMA20_LOTS:-1}"
  SENSEX_EMA20_LOTS: "${SENSEX_EMA20_LOTS:-1}"
  NG_EMA20_LOTS: "${NG_EMA20_LOTS:-1}"

  EXCLUSIVE_NIFTY_CE_BUY_TIMEFRAME_SECONDS: "30"
  EXCLUSIVE_NIFTY_CE_BUY_PRESEED_HISTORY: "true"
  EXCLUSIVE_NIFTY_CE_BUY_PRESEED_HISTORY_ROWS: "400"

  NG_SL_PCT: "0.25"
  NG_TP_PCT: "0.35"
  NG_TRAIL_BUFFER_PCT: "0.04"

  ANGEL_FETCH_COOLDOWN_BASE_SECONDS: "5"
  ANGEL_FETCH_COOLDOWN_MAX_SECONDS: "120"
  ANGEL_FETCH_RATE_LIMIT_FLOOR_SECONDS: "90"
  ANGEL_FETCH_BLOCKED_FLOOR_SECONDS: "30"
  ANGEL_FETCH_TIMEOUT_CAP_SECONDS: "60"
  ANGEL_HTTP_TIMEOUT_SECONDS: "25"
  ANGEL_ORDER_PLACE_MAX_ATTEMPTS: "2"
  ANGEL_ORDER_PLACE_RETRY_BASE_SECONDS: "0.5"
  ANGEL_ORDER_CONFIRM_TIMEOUT_SECONDS: "8"
  ANGEL_ORDER_CONFIRM_POLL_SECONDS: "0.8"

  DEFAULT_PROFIT_TARGET_PCT: "0.50"
  DEFAULT_STOPLOSS_PCT: "1.0"

  POSITION_SYNC_INTERVAL_SECONDS: "90"
  POSITION_SYNC_BLOCKED_MIN_INTERVAL_SECONDS: "90"
  ORDERS_SYNC_INTERVAL_SECONDS: "90"

  STREAM_SELF_HEAL_TOKEN_LABELS: "false"
  STREAM_SYNC_EXECUTED_TOKEN_LABELS: "false"
  STREAM_DROP_UNMAPPED_TICKS: "false"
  STREAM_UNMAPPED_TICK_LOG_INTERVAL_SECONDS: "60"

  ML_ENABLED: "false"
  ML_MODE: "OFF"

x-db-client-env: &db-client-env
  PGHOST: "${CONTROL_PLANE_PG_HOST:?Set CONTROL_PLANE_PG_HOST}"
  PGPORT: "${CONTROL_PLANE_PG_PORT:-5432}"
  PGDATABASE: "${CONTROL_PLANE_PG_DB:?Set CONTROL_PLANE_PG_DB}"
  PGUSER: "${CONTROL_PLANE_PG_USER:?Set CONTROL_PLANE_PG_USER}"
  PGPASSWORD: "${CONTROL_PLANE_PG_PASSWORD_HOST:?Set CONTROL_PLANE_PG_PASSWORD_HOST}"
  PGSSLMODE: "require"
  PGCONNECT_TIMEOUT: "10"
  PHX_MIGRATION_APP_NAME: "phoenix-oci-live"

x-migration-volumes: &migration-volumes
  - ${PHOENIX_APP_PATH:-./migrations}:/migrations:ro
  - ${PHOENIX_APP_PATH:-./scripts}/run_migrations.sh:/scripts/run_migrations.sh:ro

services:
  migrator:
    image: postgres:16-alpine
    container_name: phoenix-oci-migrator
    restart: "no"
    environment:
      <<: *db-client-env
    volumes: *migration-volumes
    command:
      - sh
      - -ec
      - |
          sed 's/\r$//' /scripts/run_migrations.sh | sh -s -- apply

  db-preflight:
    image: postgres:16-alpine
    container_name: phoenix-oci-db-preflight
    restart: "no"
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *db-client-env
      PHX_BROKER_ACCOUNT_ID: "${HUB_DEFAULT_BROKER_ACCOUNT_ID:-A1}"
    volumes: *migration-volumes
    command:
      - sh
      - -ec
      - |
          until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d "$$PGDATABASE"; do
            echo "Waiting for OCI DB $$PGHOST:$$PGPORT/$$PGDATABASE ..."
            sleep 2
          done

          sed 's/\r$//' /scripts/run_migrations.sh | sh -s -- verify

          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.users (
              id TEXT PRIMARY KEY,
              email TEXT NOT NULL,
              name TEXT NOT NULL,
              password_hash TEXT NOT NULL,
              role TEXT NOT NULL,
              created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_users_email ON public.users (lower(email));

          DO $$do$$
          BEGIN
              IF EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'broker_accounts' AND column_name = 'client_code'
              ) THEN
                  CREATE INDEX IF NOT EXISTS idx_broker_accounts_client_code ON public.broker_accounts (client_code);
              END IF;
              IF EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = 'public' AND table_name = 'subscriptions'
                    AND column_name IN ('tenant_id', 'broker_account_id', 'mode')
                  GROUP BY table_name HAVING COUNT(*) = 3
              ) THEN
                  CREATE INDEX IF NOT EXISTS idx_subscriptions_tenant_account_mode
                      ON public.subscriptions (tenant_id, broker_account_id, mode);
              END IF;
          END
          $$do$$;
          SQL

          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$do$$
          DECLARE missing text;
          BEGIN
              SELECT string_agg(name, ', ' ORDER BY name) INTO missing
              FROM (
                  SELECT required_table AS name
                  FROM (VALUES
                      ('tenants'), ('broker_accounts'), ('subscriptions'),
                      ('strategy_configs'), ('broker_credentials'),
                      ('circuit_breaker_state'), ('pnl_snapshots'), ('profit_lock_state')
                  ) AS req(required_table)
                  WHERE NOT EXISTS (
                      SELECT 1 FROM information_schema.tables t
                      WHERE t.table_schema = 'public' AND t.table_name = req.required_table
                  )
                  UNION ALL
                  SELECT required_index AS name
                  FROM (VALUES
                      ('idx_broker_accounts_client_code'),
                      ('idx_subscriptions_tenant_account_mode'),
                      ('idx_users_email')
                  ) AS req(required_index)
                  WHERE NOT EXISTS (
                      SELECT 1 FROM pg_indexes i
                      WHERE i.schemaname = 'public' AND i.indexname = req.required_index
                  )
              ) x;
              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'Missing required schema objects: %', missing;
              END IF;
          END
          $$do$$;
          SQL

          psql -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM public.broker_credentials WHERE broker_account_id = '$$PHX_BROKER_ACCOUNT_ID' LIMIT 1" \
            | grep -q 1 || {
              echo "Missing broker_credentials row for broker_account_id=$$PHX_BROKER_ACCOUNT_ID"
              exit 1
            }

  backend:
    image: "${OCIR_REGION:-ap-mumbai-1}.ocir.io/${OCIR_NAMESPACE:?Set OCIR_NAMESPACE}/phoenix-prod/backend:${IMAGE_TAG:?Set IMAGE_TAG to a specific git SHA â€” never deploy latest}"
    container_name: phoenix-oci-backend
    init: true
    restart: unless-stopped
    depends_on:
      db-preflight:
        condition: service_completed_successfully
    expose:
      - "8080"
    environment:
      <<: *live-backend-env
    secrets:
      - admin_api_key
      - auth_token_secret
      - control_plane_pg_password
      - angel_postback_token
    volumes:
      - "${PHOENIX_LOG_HOST_PATH:-/opt/phoenix/logs}:/app/logs"
      - "${PHOENIX_STATE_HOST_PATH:-/opt/phoenix/state}:/app/state"
      - "${PHOENIX_CERTS_HOST_PATH:-/opt/phoenix/certs}:/app/certs:ro"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: "1g"
    memswap_limit: "1g"
    pids_limit: 300
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: "${OCIR_REGION:-ap-mumbai-1}.ocir.io/${OCIR_NAMESPACE:?Set OCIR_NAMESPACE}/phoenix-prod/nginx:${IMAGE_TAG:?Set IMAGE_TAG to a specific git SHA â€” never deploy latest}"
    container_name: phoenix-oci-web
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Port 80: HTTP â†’ HTTPS redirect + ACME challenge
      # Port 8443: TLS terminated at nginx (OCI LB uses TCP passthrough on 443)
      - "0.0.0.0:80:80"
      - "0.0.0.0:8443:8443"
    secrets:
      - admin_api_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: "256m"
    memswap_limit: "256m"
    pids_limit: 50
    healthcheck:
      # Port 80 now redirects to HTTPS; check port 8443 directly with cert validation skipped
      # (cert is for the public domain, not 127.0.0.1 — skip-cert-check is safe for localhost probe)
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O - https://127.0.0.1:8443/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend-watchdog:
    image: docker:cli
    container_name: phoenix-oci-watchdog
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    mem_limit: "64m"
    memswap_limit: "64m"
    pids_limit: 10
    command:
      - sh
      - -c
      - |
          FAILS=0
          STOPPED=0
          RECOVER=0
          echo "[watchdog] started — polling http://backend:8080/health every 10s"
          while true; do
            if wget -q -O /dev/null --timeout=5 http://backend:8080/health 2>/dev/null; then
              FAILS=0
              if [ "$$STOPPED" = "1" ]; then
                RECOVER=$$((RECOVER+1))
                echo "[watchdog] backend healthy (recover $$RECOVER/2)"
                if [ "$$RECOVER" -ge 2 ]; then
                  echo "[watchdog] backend recovered — starting nginx"
                  docker start phoenix-oci-web || true
                  STOPPED=0
                  RECOVER=0
                fi
              fi
            else
              RECOVER=0
              if [ "$$STOPPED" = "0" ]; then
                FAILS=$$((FAILS+1))
                echo "[watchdog] backend fail $$FAILS/3"
                if [ "$$FAILS" -ge 3 ]; then
                  echo "[watchdog] backend down — stopping nginx"
                  docker stop phoenix-oci-web || true
                  STOPPED=1
                  FAILS=0
                fi
              fi
            fi
            sleep 10
          done
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# Secrets are written to /run/secrets/ by scripts/fetch-secrets.sh before compose up.
# The script pulls them from OCI Vault via instance principal auth (no credentials needed).
# Secret file names match the OCI Vault secret names (without the phoenix- prefix).
secrets:
  admin_api_key:
    file: "/run/secrets/admin_api_key"
  auth_token_secret:
    file: "/run/secrets/auth_token_secret"
  control_plane_pg_password:
    file: "/run/secrets/control_plane_pg_password"
  angel_postback_token:
    file: "/run/secrets/angel_postback_token"
